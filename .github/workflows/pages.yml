name: Publicar sites no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Validar módulo de Contas a Receber
        run: npm run test:receivables

      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site/assets _site/admin
          cp index.html app.js receivables-core.mjs styles.css _site/
          cp cash-register-core.mjs stock-order-core.mjs _site/
          cp alerts-core.mjs business-analytics-core.mjs _site/
          cp -R assets/. _site/assets/
          cp admin/index.html admin/admin.js admin/android-update-core.mjs admin/admin.css admin/notifications.css _site/admin/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
