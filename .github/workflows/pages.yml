name: Publicar sites no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validar módulo de Contas a Receber
        run: npm run test:receivables

      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site/assets _site/admin
          cp index.html _site/
          cp admin/load-error.js _site/admin/
          cp -R assets/. _site/assets/
          cp admin/index.html admin/admin.js admin/android-update-core.mjs admin/admin.css admin/notifications.css _site/admin/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
